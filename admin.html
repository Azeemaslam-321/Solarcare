<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WC4T8RMTC7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-WC4T8RMTC7');

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMSOLARCARE Admin | Leads</title>
  <meta name="theme-color" content="#111a14">
  <link rel="icon" type="image/svg+xml" href="assets/favicon-solarcare.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe6;
      --panel: rgba(255, 252, 247, 0.96);
      --panel-soft: #f2eadc;
      --text: #162019;
      --muted: #5e665f;
      --line: rgba(22, 32, 25, 0.1);
      --brand: #1e6a48;
      --brand-strong: #153d2b;
      --accent: #ef8f35;
      --danger: #a53b32;
      --shadow: 0 22px 60px rgba(30, 46, 36, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Source Sans 3', sans-serif;
      background:
        radial-gradient(circle at top right, rgba(239, 143, 53, 0.18), transparent 26%),
        radial-gradient(circle at top left, rgba(30, 106, 72, 0.12), transparent 24%),
        linear-gradient(180deg, #f7f1e7, #efe5d6);
      color: var(--text);
    }

    a { color: inherit; text-decoration: none; }
    .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; }
    .topbar, .card, .toolbar, .empty, .stat-card {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: 24px;
    }

    .topbar {
      margin: 20px 0 18px;
      padding: 24px 26px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    .topbar h1 {
      font-size: clamp(2rem, 4vw, 3.2rem);
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.04em;
      margin: 0;
    }

    .muted { color: var(--muted); }

    .toolbar {
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      padding: 18px 20px;
    }

    .stat-card strong {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      margin-top: 8px;
      color: var(--brand-strong);
    }

    .badge, .chip, .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .btn {
      cursor: pointer;
      color: var(--text);
      font: inherit;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .leads {
      display: grid;
      gap: 14px;
      margin-bottom: 26px;
    }

    .card { padding: 20px; }
    .lead-top, .lead-meta, .lead-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .lead-top { margin-bottom: 12px; }
    .lead-meta { margin-bottom: 14px; }
    .lead-type {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(30, 106, 72, 0.1);
      color: var(--brand);
      border: 1px solid rgba(30, 106, 72, 0.2);
      font-weight: 700;
    }

    .lead-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0;
    }

    .lead-field {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 250, 244, 0.96);
      border: 1px solid var(--line);
    }

    .lead-field strong {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
      font-size: 0.92rem;
    }

    .lead-actions {
      margin-top: 16px;
    }

    .reply-btn {
      background: linear-gradient(145deg, var(--brand), var(--brand-strong));
      color: #fff;
      border-color: transparent;
    }

    .call-btn {
      background: linear-gradient(145deg, #125384, #0c3555);
      color: #fff;
      border-color: transparent;
    }

    .status-good {
      color: var(--brand);
      font-weight: 700;
    }

    .status-warn {
      color: var(--danger);
      font-weight: 700;
    }

    .empty {
      padding: 44px 24px;
      text-align: center;
      margin-bottom: 26px;
    }

    @media (max-width: 780px) {
      .topbar, .toolbar, .lead-top, .lead-meta, .lead-actions {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats-grid,
      .lead-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>IMSOLARCARE Admin</h1>
        <p class="muted" style="margin:8px 0 0">All bookings and contact requests in one place, with one-click WhatsApp replies.</p>
      </div>
      <a class="badge" href="index.html"><i class="ri-home-4-line"></i> Back to site</a>
    </section>

    <section class="toolbar">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <span class="chip"><i class="ri-dashboard-line"></i> Lead dashboard</span>
        <span class="chip" id="leadCount">Loading leads...</span>
      </div>
      <button class="btn" id="refreshBtn"><i class="ri-refresh-line"></i> Refresh</button>
    </section>

    <section class="stats-grid">
      <article class="stat-card">
        <span class="muted">Total leads</span>
        <strong id="totalLeadsStat">0</strong>
      </article>
      <article class="stat-card">
        <span class="muted">Booking requests</span>
        <strong id="bookingStat">0</strong>
      </article>
      <article class="stat-card">
        <span class="muted">Contact messages</span>
        <strong id="contactStat">0</strong>
      </article>
    </section>

    <section id="emptyState" class="empty" hidden>
      <h2>No leads yet</h2>
      <p class="muted" style="margin-top:8px">New bookings and contact messages will appear here once users start submitting forms.</p>
    </section>

    <section id="leadList" class="leads"></section>
  </main>

  <script>
    const leadList = document.getElementById('leadList');
    const leadCount = document.getElementById('leadCount');
    const emptyState = document.getElementById('emptyState');
    const refreshBtn = document.getElementById('refreshBtn');
    const totalLeadsStat = document.getElementById('totalLeadsStat');
    const bookingStat = document.getElementById('bookingStat');
    const contactStat = document.getElementById('contactStat');

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(value) {
      if (!value) return 'Not available';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function buildWhatsappMessage(lead) {
      if (lead.type === 'contact') {
        return [
          `Hello ${lead.name},`,
          'IMSOLARCARE se reply kar rahe hain.',
          `Aapki query mili: ${lead.notes || 'No message provided'}`,
          'Please let us know how we can help further.'
        ].join('\n');
      }

      return [
        `Hello ${lead.name},`,
        'IMSOLARCARE se aapki booking request mil gayi hai.',
        `Service: ${lead.service || 'Not provided'}`,
        `Preferred time: ${lead.date || 'Not provided'}`,
        'Please confirm if you would like us to schedule the visit.'
      ].join('\n');
    }

    function renderLead(lead) {
      const typeLabel = lead.type === 'contact' ? 'Contact Message' : 'Booking Request';
      const notesLabel = lead.type === 'contact' ? 'Message' : 'Notes';
      const service = lead.service || 'Not provided';
      const preferred = lead.date || 'Not provided';
      const address = lead.address || 'Not provided';
      const whatsappUrl = `https://wa.me/${encodeURIComponent(lead.phone)}?text=${encodeURIComponent(buildWhatsappMessage(lead))}`;

      return `
        <article class="card">
          <div class="lead-top">
            <div>
              <div class="lead-type"><i class="ri-message-2-line"></i> ${escapeHtml(typeLabel)}</div>
              <h3 style="margin-top:12px">${escapeHtml(lead.name)}</h3>
            </div>
            <div class="muted">Received: ${escapeHtml(formatDate(lead.created_at))}</div>
          </div>

          <div class="lead-meta">
            <span class="chip"><i class="ri-phone-line"></i> ${escapeHtml(lead.phone)}</span>
            <span class="chip"><i class="ri-hashtag"></i> ID ${escapeHtml(lead.id)}</span>
          </div>

          <div class="lead-grid">
            <div class="lead-field">
              <strong>Service</strong>
              <span>${escapeHtml(service)}</span>
            </div>
            <div class="lead-field">
              <strong>Preferred</strong>
              <span>${escapeHtml(preferred)}</span>
            </div>
            <div class="lead-field">
              <strong>Address</strong>
              <span>${escapeHtml(address)}</span>
            </div>
            <div class="lead-field">
              <strong>${escapeHtml(notesLabel)}</strong>
              <span>${escapeHtml(lead.notes || 'Not provided')}</span>
            </div>
          </div>

          <div class="lead-actions">
            <span class="muted">Type: ${escapeHtml(lead.type)}</span>
            <div style="display:flex;flex-wrap:wrap;gap:10px">
              <a class="btn call-btn" href="tel:${escapeHtml(lead.phone)}">
                <i class="ri-phone-line"></i> Call now
              </a>
              <a class="btn reply-btn" href="${whatsappUrl}" target="_blank" rel="noopener noreferrer">
                <i class="ri-whatsapp-line"></i> Reply on WhatsApp
              </a>
            </div>
          </div>
        </article>
      `;
    }

    function updateStats(leads) {
      const bookings = leads.filter((lead) => lead.type === 'booking').length;
      const contacts = leads.filter((lead) => lead.type === 'contact').length;
      totalLeadsStat.textContent = String(leads.length);
      bookingStat.textContent = String(bookings);
      contactStat.textContent = String(contacts);
    }

    async function loadLeads() {
      leadCount.textContent = 'Loading leads...';
      leadList.innerHTML = '';
      emptyState.hidden = true;
      totalLeadsStat.textContent = '0';
      bookingStat.textContent = '0';
      contactStat.textContent = '0';

      try {
        const response = await fetch('/api/admin/leads');
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          if (response.status === 401) {
            throw new Error('Open /admin instead of /admin.html so browser authentication works correctly.');
          }
          throw new Error('Server did not return JSON. Open /admin instead of /admin.html and refresh.');
        }

        const data = await response.json();
        if (!response.ok || !data.ok) {
          throw new Error(data.error || 'Failed to load leads');
        }

        const leads = Array.isArray(data.leads) ? data.leads : [];
        leadCount.textContent = `${leads.length} total lead${leads.length === 1 ? '' : 's'}`;
        updateStats(leads);

        if (!leads.length) {
          emptyState.hidden = false;
          return;
        }

        leadList.innerHTML = leads.map(renderLead).join('');
      } catch (error) {
        leadCount.innerHTML = '<span class="status-warn">Unable to load leads</span>';
        emptyState.hidden = false;
        emptyState.innerHTML = `
          <h2>Could not load leads</h2>
          <p class="muted" style="margin-top:8px">${escapeHtml(error.message)}</p>
          <p class="muted" style="margin-top:8px">Recommended: open <strong>/admin</strong> instead of <strong>/admin.html</strong> so basic authentication can work properly.</p>
        `;
      }
    }

    refreshBtn.addEventListener('click', loadLeads);
    loadLeads();
  </script>
</body>
</html>
